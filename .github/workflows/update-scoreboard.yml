name: Update Scoreboard

on:
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate scoreboard
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OAUTH_CLIENT_ID:   ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_WORKER_URL:  ${{ secrets.OAUTH_WORKER_URL }}
          CANCEL_WORKER_URL: ${{ secrets.CANCEL_WORKER_URL }}
        run: python scripts/generate.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/positions.json docs/bets.json
          git diff --staged --quiet && echo "No changes." || \
            (git commit -m "chore: update scoreboard [skip ci]" && git pull --rebase --autostash && git push)
